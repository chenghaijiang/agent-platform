[project]
name = "agent-platform"
version = "0.1.0"
description = "企业内部 Agent 平台 MVP（同步知识问答，ADR-004 Compose 单机底座）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "pyjwt>=2.10.0",
    "openai>=1.60.0",
    "langfuse>=3.0.0",
    "pgvector>=0.3.0",
    "pypdf>=5.0.0",
    "boto3>=1.34.0",
    "python-multipart>=0.0.9",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "pyyaml>=6.0.3",
    # AgentDesk checks 运行时依赖（T11，ADR-013）：演示仓 pytest/ruff 须在容器内零额外依赖可运行，
    # 故为平台主依赖而非 dev 组（镜像 uv sync --no-dev 也安装）
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=1.0.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
# 仅收集 tests/：src/ 下随包发布的 AgentDesk 演示仓（test_pricing.py 预置失败缺陷）不进平台套件
testpaths = ["tests"]

[tool.ruff.lint]
# B008：FastAPI Depends(...) 参数默认值是框架官方惯例，全部路由文件统一豁免
ignore = ["B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_platform"]
